version: '3.8'

services:
  # Backend GS-RPA (Porta 8000)
  backend-gs-rpa:
    build:
      context: ./backend/rpa
      dockerfile: Dockerfile
    container_name: gs-rpa-api
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DATABASE_URL=postgresql://user:password@postgres:5432/gs_rpa
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/rpa:/app
    depends_on:
      - postgres
    networks:
      - app-network
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload

  # Backend Quântico (Porta 8001)
  backend-quantica:
    build:
      context: ./backend/quantica
      dockerfile: Dockerfile
    container_name: quantica-api
    ports:
      - "8001:8001"
    volumes:
      - ./backend/quantica:/app
    networks:
      - app-network
    command: uvicorn api:app --host 0.0.0.0 --port 8001 --reload

  # Frontend (Porta 3000)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
    networks:
      - app-network
    command: npm run dev

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: gs-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gs_rpa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (Ferramenta visual para PostgreSQL - Porta 5050)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gs-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
