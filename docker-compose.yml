version: '3.8'

services:
  # Backend GS-RPA (Porta 8000)
  backend-gs-rpa:
    build:
      context: ./backend/rpa
      dockerfile: Dockerfile
    container_name: gs-rpa-api
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DATABASE_URL=postgresql://user:password@postgres:5432/gs_rpa
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/rpa:/app
    depends_on:
      - postgres
    networks:
      - app-network
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload

  # Backend Quântico (Porta 8001)
  backend-quantica:
    build:
      context: ./backend/quantica
      dockerfile: Dockerfile
    container_name: quantica-api
    ports:
      - "8001:8001"
    volumes:
      - ./backend/quantica:/app
    networks:
      - app-network
    command: uvicorn api:app --host 0.0.0.0 --port 8001 --reload

  # Backend GenAI / RAG — ORBITAL SENTINEL (Porta 8003)
  backend-genai:
    build:
      context: ./backend/genai
      dockerfile: Dockerfile
    container_name: genai-api
    ports:
      - "8003:8003"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./backend/genai:/app
    networks:
      - app-network
    command: uvicorn api:app --host 0.0.0.0 --port 8003 --reload

  # Backend PLN — Sueteres RAG (Porta 8005)
  backend-pln:
    build:
      context: ./backend/pln
      dockerfile: Dockerfile
    container_name: pln-rag-api
    ports:
      - "8005:8005"
    environment:
      - APP_ENV=production
    volumes:
      - ./backend/pln:/app
    networks:
      - app-network
    command: uvicorn api.main:app --host 0.0.0.0 --port 8005 --reload

  # Backend Neuromórfica — NeuroSpace Alert (Porta 8004)
  backend-neuromorfica:
    build:
      context: ./backend/neuromorfica
      dockerfile: Dockerfile
    container_name: neuromorfica-api
    ports:
      - "8004:8004"
    volumes:
      - ./backend/neuromorfica:/app
    networks:
      - app-network
    command: uvicorn api:app --host 0.0.0.0 --port 8004 --reload

  # Frontend (Porta 3000)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8000
      - VITE_GENAI_API_URL=http://localhost:8003
      - VITE_NEURO_API_URL=http://localhost:8004
      - VITE_PLN_API_URL=http://localhost:8005
    volumes:
      - ./frontend/src:/app/src
    networks:
      - app-network
    command: npm run dev

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: gs-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gs_rpa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (Ferramenta visual para PostgreSQL - Porta 5050)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gs-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
